<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新世纪之夜 · Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060814;
      --bg-2: #0a0e1f;
      --surface: rgba(15, 20, 40, 0.6);
      --surface-2: rgba(22, 28, 52, 0.75);
      --border: rgba(100, 120, 180, 0.18);
      --border-hover: rgba(130, 150, 210, 0.35);
      --text: #dfe5f0;
      --text-muted: #8a93a8;
      --text-dim: #5a6378;
      --accent: #7c9eff;
      --accent-glow: rgba(124, 158, 255, 0.15);
      --gold: #e8c87a;
      --gold-glow: rgba(232, 200, 122, 0.12);
      --pink: #e891b0;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-serif: 'Noto Serif SC', serif;
      --font-sans: 'Noto Sans SC', 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.8;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ━━ Starfield Background ━━ */
    #starfield {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    .bg-gradient {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(60, 80, 140, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(140, 80, 120, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(80, 100, 160, 0.06), transparent);
      z-index: 1; pointer-events: none;
    }

    .container {
      position: relative; z-index: 2;
      max-width: 800px; margin: 0 auto; padding: 0 20px;
    }

    /* ━━ Header ━━ */
    header {
      padding: 80px 0 50px; text-align: center;
    }

    .site-title {
      font-family: var(--font-serif);
      font-size: 42px; font-weight: 900;
      background: linear-gradient(135deg, #e8c87a 0%, #7c9eff 50%, #c08ce8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .site-subtitle {
      font-size: 13px; color: var(--text-dim);
      letter-spacing: 6px; text-transform: uppercase;
    }

    .moon {
      position: absolute; top: 40px; right: 30px;
      width: 50px; height: 50px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f5f0e0, #c8c0a8);
      box-shadow: 0 0 40px rgba(232, 200, 122, 0.3), 0 0 80px rgba(232, 200, 122, 0.1);
      opacity: 0.7;
    }

    /* ━━ Music Player ━━ */
    .music-player {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      background: var(--surface-2); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 14px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: var(--transition);
      max-width: 320px;
    }

    .music-player .disc {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #2a2a2a, #555);
      border: 2px solid #8a6d3b;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
      animation: spin 4s linear infinite; animation-play-state: paused;
    }

    .music-player .disc.playing { animation-play-state: running; }

    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

    .music-player .info {
      font-size: 12px; line-height: 1.4; cursor: pointer; min-width: 0;
    }
    .music-player .info .song { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    .music-player .info .artist { color: var(--text-dim); font-size: 11px; }

    .music-player .btn {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: var(--transition);
    }
    .music-player .btn:hover { background: #5a7de8; }
    .music-player .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .music-player .progress {
      position: absolute; bottom: 0; left: 0; width: 0%;
      height: 2px; background: linear-gradient(90deg, var(--accent), var(--gold));
      border-radius: 0 0 14px 14px; transition: width 0.3s ease;
    }

    /* ━━ Posts ━━ */
    .posts { padding-bottom: 100px; }

    .post {
      background: var(--surface); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px 36px; margin-bottom: 24px;
      transition: var(--transition);
    }

    .post:hover {
      border-color: var(--border-hover);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      transform: translateY(-2px);
    }

    .post-date {
      font-size: 12px; color: var(--gold); letter-spacing: 2px;
      font-family: var(--font-sans); margin-bottom: 8px;
    }

    .post-title {
      font-family: var(--font-serif); font-size: 24px; font-weight: 700;
      color: var(--text); margin-bottom: 16px; line-height: 1.4;
    }

    .post-content {
      font-family: var(--font-serif); font-size: 15px; font-weight: 300;
      color: var(--text-muted); line-height: 2; white-space: pre-wrap;
    }

    .post-content p { margin-bottom: 14px; }

    .post-content strong { color: var(--gold); font-weight: 500; }

    .post-divider {
      width: 40px; height: 2px; background: linear-gradient(90deg, var(--accent), transparent);
      margin: 20px 0;
    }

    /* ━━ Login Button & Modal ━━ */
    .login-btn {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      background: var(--surface-2); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: var(--transition);
      color: var(--text-muted);
    }
    .login-btn:hover { border-color: var(--accent); color: var(--accent); }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5, 8, 20, 0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 36px; width: 90%; max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .modal h2 {
      font-family: var(--font-serif); font-size: 22px; font-weight: 700;
      margin-bottom: 24px; text-align: center;
    }

    .modal input {
      width: 100%; padding: 12px 16px; margin-bottom: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 14px; font-family: var(--font-sans);
      transition: var(--transition);
    }
    .modal input:focus { outline: none; border-color: var(--accent); }

    .modal button {
      width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: var(--transition); font-family: var(--font-sans);
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #5a7de8; }

    .btn-secondary { background: transparent; color: var(--text-muted); margin-top: 8px; }
    .btn-secondary:hover { color: var(--text); }

    /* ━━ Admin Panel ━━ */
    .admin-bar {
      display: none; background: var(--surface-2); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 24px; margin-bottom: 24px;
      align-items: center; justify-content: space-between; gap: 12px;
    }
    .admin-bar.active { display: flex; }

    .admin-bar .label {
      font-size: 13px; color: var(--gold); font-weight: 500;
    }

    .admin-bar .actions { display: flex; gap: 8px; }

    .admin-btn {
      padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px;
      background: transparent; color: var(--text); font-size: 13px;
      cursor: pointer; transition: var(--transition); font-family: var(--font-sans);
    }
    .admin-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
    .admin-btn.danger:hover { border-color: #e8505a; background: rgba(232,80,90,0.1); }

    /* ━━ Editor ━━ */
    .editor-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5,8,20,0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
    }
    .editor-overlay.active { display: flex; }

    .editor {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; width: 95%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
    }

    .editor h2 { font-family: var(--font-serif); margin-bottom: 20px; font-size: 22px; }

    .editor input[type="text"], .editor input[type="date"], .editor textarea {
      width: 100%; padding: 12px 16px; margin-bottom: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-size: 14px; font-family: var(--font-sans);
    }
    .editor textarea { min-height: 240px; resize: vertical; line-height: 1.8; font-family: var(--font-serif); }
    .editor input:focus, .editor textarea:focus { outline: none; border-color: var(--accent); }

    .editor-actions { display: flex; gap: 8px; }
    .editor-actions button { flex: 1; }

    /* ━━ Toast ━━ */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--surface-2); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 20px; font-size: 13px; color: var(--text); z-index: 300;
      opacity: 0; transition: 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ━━ Footer ━━ */
    footer {
      text-align: center; padding: 40px 0; color: var(--text-dim);
      font-size: 12px; letter-spacing: 1px;
    }

    /* ━━ Responsive ━━ */
    @media (max-width: 600px) {
      .site-title { font-size: 32px; }
      .post { padding: 24px 20px; }
      .moon { width: 36px; height: 36px; top: 20px; right: 15px; }
      .music-player { max-width: 260px; bottom: 12px; right: 12px; }
      .music-player .info .song { max-width: 130px; }
      .admin-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Starfield Canvas -->
  <canvas id="starfield"></canvas>
  <div class="bg-gradient"></div>

  <!-- Moon -->
  <div class="moon"></div>

  <!-- Login Button -->
  <div class="login-btn" onclick="openLogin()" title="后台登录">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>

  <div class="container">
    <header>
      <h1 class="site-title">新世纪之夜</h1>
      <p class="site-subtitle">A NEW CENTURY NIGHT</p>
    </header>

    <!-- Admin Bar -->
    <div class="admin-bar" id="adminBar">
      <span class="label">● 管理模式</span>
      <div class="actions">
        <button class="admin-btn" onclick="openEditor()">+ 新建文章</button>
        <button class="admin-btn danger" onclick="logout()">退出</button>
      </div>
    </div>

    <!-- Posts -->
    <div class="posts" id="posts"></div>

    <footer>
      <p>新世纪之夜 · 2026 · 在星空下记录每一刻美好</p>
    </footer>
  </div>

  <!-- Music Player -->
  <div class="music-player" id="musicPlayer">
    <div class="disc" id="disc">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color:#e8c87a;">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <div class="info" onclick="nextTrack()" title="点击切换下一首">
      <div class="song" id="songName">点击播放</div>
      <div class="artist" id="artistName">周杰伦</div>
    </div>
    <button class="btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">▶</button>
    <button class="btn" id="nextBtn" onclick="nextTrack()" title="下一首" style="background:transparent;border:1px solid var(--border);width:24px;height:24px;font-size:10px;">⏭</button>
    <div class="progress" id="progressBar"></div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginOverlay">
    <div class="modal">
      <h2>后台登录</h2>
      <input type="text" id="loginUser" placeholder="账号" autocomplete="off">
      <input type="password" id="loginPass" placeholder="密码" autocomplete="off">
      <button class="btn-primary" onclick="doLogin()">登录</button>
      <button class="btn-secondary" onclick="closeLogin()">取消</button>
    </div>
  </div>

  <!-- Editor Modal -->
  <div class="editor-overlay" id="editorOverlay">
    <div class="editor">
      <h2>新建文章</h2>
      <input type="text" id="editTitle" placeholder="文章标题">
      <input type="date" id="editDate">
      <textarea id="editContent" placeholder="写下你的故事..."></textarea>
      <div class="editor-actions">
        <button class="btn-secondary" onclick="closeEditor()">取消</button>
        <button class="btn-primary" onclick="savePost()">发布</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- HTML5 Audio Player (NetEase Cloud Music) -->
  <audio id="audioPlayer" preload="metadata"></audio>

  <script>
    // ━━ Starfield Animation ━━
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 3500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.2 + 0.2,
          o: Math.random() * 0.5 + 0.2,
          tw: Math.random() * 0.03 + 0.005,
          ph: Math.random() * Math.PI * 2
        });
      }
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() * 0.001;
      stars.forEach(s => {
        const tw = Math.sin(t * s.tw * 60 + s.ph) * 0.4 + 0.6;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200, 220, 255, ' + (s.o * tw) + ')';
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // ━━ Blog Posts ━━
    const DEFAULT_POSTS = [
      {
        id: 1,
        date: '2026-07-27',
        title: '宝宝出生了',
        content: `亲爱的宝贝，欢迎来到这个世界。

2026年7月27日，这是一个被星空祝福的日子。你的第一声啼哭，如同新世纪的序曲，划破了漫长等待的夜空，从此我们的世界多了一束最温暖的光。

你那么小，小到刚好躺在我的臂弯里；你又那么大，大到填满了我们整个宇宙。那些在星空下许下的愿望，那些在深夜里默默祈祷的日子，在这一刻都有了回响。

**你的到来，是新世纪最好的礼物。**

看着你紧闭的双眼和小小的拳头，我在想，这个世界会以怎样的方式向你展开。有星空为你引路，有月光为你守护，有无数个夜晚为你温柔地亮着。

我会教你认星星的名字，带你听周杰伦的歌，告诉你每一朵云彩的故事。而你，只需要慢慢长大，慢慢探索，慢慢爱上这个充满奇迹的世界。

今夜，星星格外明亮。不是因为它们比平时更耀眼，而是因为——从此以后，每一颗星星，都多了一个可以照耀的人。

宝贝，晚安。欢迎来到新世纪之夜。`
      }
    ];

    function getPosts() {
      const saved = localStorage.getItem('blog_posts');
      if (saved) {
        try { return JSON.parse(saved); } catch(e) { return [...DEFAULT_POSTS]; }
      }
      // First visit: seed with default post
      localStorage.setItem('blog_posts', JSON.stringify(DEFAULT_POSTS));
      return [...DEFAULT_POSTS];
    }

    function savePosts(posts) {
      localStorage.setItem('blog_posts', JSON.stringify(posts));
    }

    function renderPosts() {
      const posts = getPosts();
      const container = document.getElementById('posts');
      container.innerHTML = posts.map(p => {
        const dateDisplay = p.date ? p.date.split('-').join('.') : '';
        const contentHtml = p.content
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '</p><p>');
        return `
          <article class="post">
            <div class="post-date">${dateDisplay}</div>
            <h2 class="post-title">${escapeHtml(p.title)}</h2>
            <div class="post-content"><p>${contentHtml}</p></div>
            ${isAdmin() ? `<div class="post-divider"></div><button class="admin-btn danger" style="font-size:12px;padding:4px 12px;" onclick="deletePost(${p.id})">删除</button>` : ''}
          </article>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ━━ Auth ━━
    function isAdmin() { return sessionStorage.getItem('blog_admin') === 'true'; }

    function openLogin() {
      if (isAdmin()) { showToast('已是管理员'); return; }
      document.getElementById('loginOverlay').classList.add('active');
      document.getElementById('loginUser').focus();
    }

    function closeLogin() {
      document.getElementById('loginOverlay').classList.remove('active');
    }

    function doLogin() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if (user === 'root' && pass === 'root') {
        sessionStorage.setItem('blog_admin', 'true');
        closeLogin();
        showToast('登录成功，欢迎回来');
        updateAdminUI();
        renderPosts();
      } else {
        showToast('账号或密码错误');
      }
    }

    function logout() {
      sessionStorage.removeItem('blog_admin');
      showToast('已退出登录');
      updateAdminUI();
      renderPosts();
    }

    function updateAdminUI() {
      const bar = document.getElementById('adminBar');
      if (isAdmin()) bar.classList.add('active');
      else bar.classList.remove('active');
    }

    // ━━ Editor ━━
    function openEditor() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('editDate').value = today;
      document.getElementById('editTitle').value = '';
      document.getElementById('editContent').value = '';
      document.getElementById('editorOverlay').classList.add('active');
    }

    function closeEditor() {
      document.getElementById('editorOverlay').classList.remove('active');
    }

    function savePost() {
      const title = document.getElementById('editTitle').value.trim();
      const date = document.getElementById('editDate').value;
      const content = document.getElementById('editContent').value.trim();
      if (!title || !content) { showToast('标题和内容不能为空'); return; }
      const posts = getPosts();
      posts.unshift({ id: Date.now(), date, title, content });
      savePosts(posts);
      closeEditor();
      showToast('文章已发布');
      renderPosts();
    }

    function deletePost(id) {
      if (!confirm('确认删除这篇文章？')) return;
      const posts = getPosts().filter(p => p.id !== id);
      savePosts(posts);
      showToast('已删除');
      renderPosts();
    }

    // ━━ Toast ━━
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ━━ Music Player (NetEase Cloud Music + HTML5 Audio) ━━
    // NetEase song IDs for Jay Chou classics
    const playlist = [
      { title: '晴天', artist: '周杰伦', neteaseId: '186016' },
      { title: '夜曲', artist: '周杰伦', neteaseId: '26006' },
      { title: '稻香', artist: '周杰伦', neteaseId: '185809' },
      { title: '青花瓷', artist: '周杰伦', neteaseId: '185770' },
      { title: '七里香', artist: '周杰伦', neteaseId: '185810' },
      { title: '听妈妈的话', artist: '周杰伦', neteaseId: '185808' }
    ];

    let currentTrack = 0;
    let isPlaying = false;
    let isLoading = false;
    let loadRetries = 0;

    const audio = document.getElementById('audioPlayer');
    const disc = document.getElementById('disc');
    const playBtn = document.getElementById('playBtn');
    const songNameEl = document.getElementById('songName');
    const artistNameEl = document.getElementById('artistName');

    // Build NetEase Cloud Music outer URL (302 redirect to actual mp3)
    function getMusicUrl(neteaseId) {
      return 'https://music.163.com/song/media/outer/url?id=' + neteaseId + '.mp3';
    }

    // Fallback: Musicbank MP3 URLs (mirror)
    function getFallbackUrl(neteaseId) {
      return 'https://music.163.com/song/media/outer/url?id=' + neteaseId;
    }

    function loadTrack(idx) {
      currentTrack = idx;
      const track = playlist[currentTrack];
      songNameEl.textContent = track.title;
      artistNameEl.textContent = track.artist;
      audio.src = getMusicUrl(track.neteaseId);
      audio.load();
      loadRetries = 0;
    }

    function updatePlayBtn() {
      if (isLoading) {
        playBtn.textContent = '◌';
        playBtn.style.fontSize = '12px';
      } else if (isPlaying) {
        playBtn.textContent = '❚❚';
        playBtn.style.fontSize = '11px';
      } else {
        playBtn.textContent = '▶';
        playBtn.style.fontSize = '14px';
      }
    }

    function togglePlay() {
      if (isLoading) {
        showToast('正在加载音乐...');
        return;
      }
      if (isPlaying) {
        audio.pause();
      } else {
        // If no src loaded yet, load first track
        if (!audio.src) {
          loadTrack(0);
        }
        audio.play().catch(err => {
          console.error('Play failed:', err);
          showToast('播放失败，尝试下一首...');
          // Try next track on failure
          if (loadRetries < playlist.length) {
            loadRetries++;
            nextTrack();
          }
        });
      }
    }

    function nextTrack() {
      const next = (currentTrack + 1) % playlist.length;
      loadTrack(next);
      if (isPlaying || audio.played.length > 0) {
        audio.play().catch(err => {
          console.error('Next track play failed:', err);
          if (loadRetries < playlist.length - 1) {
            loadRetries++;
            setTimeout(() => nextTrack(), 1000);
          } else {
            isPlaying = false;
            isLoading = false;
            updatePlayBtn();
            disc.classList.remove('playing');
            showToast('部分歌曲可能无法播放，请稍后再试');
          }
        });
      }
    }

    // ━━ Audio Event Handlers ━━
    audio.addEventListener('loadstart', () => {
      isLoading = true;
      updatePlayBtn();
    });

    audio.addEventListener('canplay', () => {
      isLoading = false;
      updatePlayBtn();
    });

    audio.addEventListener('playing', () => {
      isPlaying = true;
      isLoading = false;
      updatePlayBtn();
      disc.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      updatePlayBtn();
      disc.classList.remove('playing');
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      disc.classList.remove('playing');
      nextTrack();
    });

    audio.addEventListener('error', (e) => {
      console.error('Audio error:', audio.error, 'code:', audio.error ? audio.error.code : 'unknown');
      isLoading = false;
      isPlaying = false;
      updatePlayBtn();
      disc.classList.remove('playing');

      // If error code 4 (MEDIA_ERR_SRC_NOT_SUPPORTED), try fallback URL
      if (audio.error && audio.error.code === 4 && loadRetries < 2) {
        loadRetries++;
        const track = playlist[currentTrack];
        // Try without .mp3 suffix as fallback
        audio.src = getFallbackUrl(track.neteaseId);
        audio.load();
        audio.play().catch(() => {
          // If fallback also fails, skip to next track
          if (loadRetries < playlist.length) {
            setTimeout(() => nextTrack(), 800);
          }
        });
      } else if (loadRetries < playlist.length) {
        loadRetries++;
        showToast('该歌曲暂时无法播放，切换下一首...');
        setTimeout(() => nextTrack(), 800);
      } else {
        showToast('音乐源暂时不可用，请稍后再试');
      }
    });

    audio.addEventListener('waiting', () => {
      isLoading = true;
      updatePlayBtn();
    });

    audio.addEventListener('stalled', () => {
      isLoading = false;
      updatePlayBtn();
    });

    // ━━ Progress Bar ━━
    const progressBar = document.getElementById('progressBar');
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && audio.duration > 0) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });
    audio.addEventListener('loadstart', () => {
      progressBar.style.width = '0%';
    });

    // ━━ Init: Load first track info (don't autoplay) ━━
    loadTrack(0);
    // Reset to paused state
    isPlaying = false;
    isLoading = false;
    updatePlayBtn();

    // ━━ Enter key for login ━━
    document.getElementById('loginPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('loginUser').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginPass').focus();
    });

    // ━━ Init ━━
    renderPosts();
    updateAdminUI();
  </script>
</body>
</html>
